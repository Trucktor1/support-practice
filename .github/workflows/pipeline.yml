name: Verify and deliver
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: support-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon spotlessCheck test integrationTest jacocoTestReport bootJar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            build/reports
            build/test-results
      - name: Container and operations
        run: |
          echo "DB_PASSWORD=$(openssl rand -hex 24)" > .env
          docker compose up -d --build --wait --wait-timeout 240
          python3 scripts/smoke.py
          bash scripts/verify-operations.sh
      - run: docker compose down -v
        if: always()
  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}
  deploy:
    needs: publish
    runs-on: [self-hosted, linux, support-training]
    environment: training
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_READ_TOKEN }}
      - name: Deploy and smoke check
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          PASSWORD: ${{ secrets.TRAINING_DB_PASSWORD }}
        run: |
          target="$HOME/support-practice-training"
          mkdir -p "$target/scripts"
          cp compose.yaml "$target/"
          cp scripts/* "$target/scripts/"
          printf 'DB_PASSWORD=%s\n' "$PASSWORD" > "$target/.env"
          chmod 600 "$target/.env"
          bash "$target/scripts/deploy.sh" "$IMAGE"
          echo "Deployed $IMAGE" >> "$GITHUB_STEP_SUMMARY"
